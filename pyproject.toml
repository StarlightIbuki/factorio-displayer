[build-system]
requires = [
    "hatchling>=1.21",
    "factorio-draftsman>=3.0.0",
]
build-backend = "hatchling.build"

[project]
name = "factorio-display"
version = "0.1.0"
description = "Factorio display video encoder and audio decoder blueprint builder"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "suika" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "factorio-draftsman>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0",
    "tqdm>=4.65.0",
]

[project.scripts]
factorio-display = "factorio_display.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
audio = [
    "mido>=1.3",
    "soundfile>=0.12",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "brotli>=1.1",
]
# AI transcription for non-MIDI audio (MP3/WAV/...).  Optional because it needs
# TensorFlow, which only has wheels for Python ≤ 3.13 — install it in a
# separate interpreter/venv and point FACTORIO_BASIC_PITCH_PYTHON at it.
#   python3.11 -m venv .venv-bp
#   .venv-bp/Scripts/python -m pip install basic-pitch
basic-pitch = [
    "basic-pitch>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_display"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto -m 'not perf' -x"
filterwarnings = [
    "error",
]