[build-system]
requires = [
    "hatchling>=1.21",
    "factorio-draftsman>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]
build-backend = "hatchling.build"

[project]
name = "factorio-display"
version = "0.1.0"
description = "Factorio display blueprint builder and video encoder"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "suika" }]

dependencies = [
    "factorio-draftsman>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0",
    "tqdm>=4.65.0",
]

[project.scripts]
factorio-display = "factorio_display.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_display"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]